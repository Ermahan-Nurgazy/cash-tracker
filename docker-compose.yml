services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./docker/php
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      YII_DEBUG: ${YII_DEBUG}
      YII_ENV: ${YII_ENV}
      COOKIE_VALIDATION_KEY: ${COOKIE_VALIDATION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_PROXY_TARGET: http://nginx
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - nginx

volumes:
  pgdata:
